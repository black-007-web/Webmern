<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>📚 Fable Forest API</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #e0f7fa, #fff);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
    }

    h1 {
      font-size: 3em;
      color: #2c3e50;
      animation: fadeInDown 1s ease-out;
    }

    p {
      font-size: 1.2em;
      color: #34495e;
      margin-top: 20px;
      animation: fadeInUp 1.5s ease-out;
    }

    .pulse {
      margin-top: 40px;
      padding: 12px 24px;
      background-color: #2ecc71;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1em;
      cursor: pointer;
      animation: pulse 2s infinite;
      transition: transform 0.3s ease;
    }

    .pulse:hover {
      transform: scale(1.1);
    }

    .designer {
      margin-top: 30px;
      font-size: 1.3em;
      font-weight: bold;
      background: linear-gradient(to right, #ff6f61, #6a5acd);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: glow 2s infinite alternate, fadeInUp 2s ease-out;
    }

    @keyframes fadeInDown {
      from {
        opacity: 0;
        transform: translateY(-30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes pulse {
      0% {
        transform: scale(1);
      }
      50% {
        transform: scale(1.05);
      }
      100% {
        transform: scale(1);
      }
    }

    @keyframes glow {
      from {
        text-shadow: 0 0 5px rgba(255, 111, 97, 0.6);
      }
      to {
        text-shadow: 0 0 15px rgba(106, 90, 205, 0.9);
      }
    }
  </style>
</head>
<body>
  <h1>🌲 Welcome to Fable Forest API</h1>
  <p>Your gateway to magical data experiences.</p>
  <p>Status: ✅ API is running smoothly</p>
  <button class="pulse" onclick="alert('API is alive and kicking!')">Check Status</button>

  <div class="designer">✨ Designed by Mohammad Farial ✨</div>
</body>
</html>
